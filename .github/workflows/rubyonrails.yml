name: "Ruby on Rails CI"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run tests
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Lint Ruby files
        run: bundle exec rubocop

  e2e:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: development
      CYPRESS_BASE_URL: http://127.0.0.1:3055
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Cypress
        run: |
          npm ci
          npx cypress install
      - name: Start the app
        run: |
          mkdir -p tmp/pids log
          bundle exec puma -p 3055 -e development -w 0 -t 1:4 config.ru > log/puma-ci.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://127.0.0.1:3055/ && exit 0
            sleep 1
          done
          cat log/puma-ci.log
          exit 1
      - name: Run Cypress
        run: npx cypress run
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tmp/cypress/screenshots
