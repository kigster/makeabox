inherit_gem:
  relaxed-rubocop: .rubocop.yml

inherit_from:
  - .rubocop_todo.yml

plugins:
  - rubocop-rspec
  - rubocop-rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  UseCache: false
  DefaultFormatter: progress
  Exclude:
    - "bin/*"
    - "**/rubocop"
    - "**/vendor/bundle/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
  Include:
    - '**/*.rb'
    - '**/*.gemfile'
    - '**/*.gemspec'
    - '**/*.rake'
    - '**/*.ru'
    - '**/Gemfile'
    - '**/Rakefile'

Metrics/BlockLength:
  Exclude:
    - Gemfile

Layout/HashAlignment:
  EnforcedColonStyle: table
